# Committed placeholders. Every key here becomes a BuildConfig field in :core:network.
# Real values go in secrets.properties (git-ignored), which overrides these key by key.
#
# SUPABASE_PUBLISHABLE_KEY is the client key ("Publishable key", or the legacy "anon" key).
# NEVER use the secret / service_role key: it bypasses row level security, and the build
# refuses it.
#
# With these placeholders the app builds and runs, and shows a "backend not configured" screen.
SUPABASE_URL=https://unconfigured.invalid
SUPABASE_PUBLISHABLE_KEY=unconfigured
