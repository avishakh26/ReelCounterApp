# Gradle daemon. Explicit GC and code-cache settings keep long IDE sessions from degrading.
org.gradle.jvmargs=-Dfile.encoding=UTF-8 -XX:+UseG1GC -XX:SoftRefLRUPolicyMSPerMB=1 -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError -Xmx4g
kotlin.daemon.jvmargs=-Dfile.encoding=UTF-8 -XX:+UseG1GC -XX:ReservedCodeCacheSize=320m -Xmx3g

org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
kotlin.code.style=official

# Build features we don't use; disabling them skips their tasks in every module.
android.defaults.buildfeatures.resvalues=false
android.defaults.buildfeatures.shaders=false

# Set to true locally or in CI to fail the build on any Kotlin warning.
warningsAsErrors=false
